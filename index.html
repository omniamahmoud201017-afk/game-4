<!--
  بنية الملف:
  1) اللعبة الأولى (الكود الأول) تبدأ مباشرة وتسجّل أداء الطفل في كل مرحلة.
  2) بعد آخر مرحلة ينتقل الطفل تلقائيًا إلى اللعبة الثانية (التعليم الذكي).
  3) بعد آخر سؤال ينتقل إلى اللعبة الثالثة (الحروف وقواعد الصف).
  4) بعد اللعبة الثالثة ينتقل إلى اللعبة الرابعة (مغامرات بسنت).
  5) في نهاية اللعبة الرابعة تظهر تحليلات التعلم الشاملة للألعاب الأربع.
  كل لعبة محفوظة بكودها الأصلي داخل وسم script من نوع text/plain
  وتُعرض داخل إطار مستقل، لذلك لا يتأثر تصميم أي منهما بالأخرى.
  التعديلات على الكودين وظيفية فقط (تسجيل البيانات والانتقال والتقرير)، ولا تمس التصميم.
-->

    <script>
        let currentStage = 0;

        // --- تتبّع بيانات التعلم لإرسالها إلى التقرير النهائي ---
        const g1Start = Date.now();
        let stageStartTime = Date.now();
        const g1Stats = [];

        const stagesData = [
            {
                title: "المرحلة الأولى: شرح المعلمة للطريقة الجديدة",

                question: "🤔 ماذا يتوجب على بسنت فعله عندما شرحت المعلمة مسألة الطرح بطريقة جديدة؟",
                successText: "أحسنت! تقبلت بسنت الطريقة الجديدة بسعة صدر ومرحبة بالتعلم.",
                options: [
                    { type: "angry", img: "q1-1.jpg", label: "حزينة ومنزعجة من التغيير", alt: "بسنت حزينة" },
                    { type: "happy", img: "q1-2.jpg", label: "مرحبة ومتفتحة لتعلم الطريقة الجديدة", alt: "بسنت مرحبة ومبتسمة" },
                    { type: "angry", img: "q1-3.jpg", label: "تشير بالسالب وتعترض بحدة", alt: "بسنت تشير بالسالب" }
                ]
            },
            {
                title: "المرحلة الثانية: عند عدم فهم الطريقة الجديدة",
                story: "حين بدأت المعلمة بتطبيق طريقة العد التصاعدي من الأصغر للأكبر، وجدت بسنت صعوبة في فهمها للوهلة الأولى ولم تدرك كيف تطبقها تماماً كما اعتادت في الطريقة القديمة.",
                question: "🤔 ماذا يتوجب على بسنت فعله عندما لم تفهم الطريقة الجديدة؟",
                successText: "رائع جداً! استفسرت بسنت وسألت معلمتها بهدوء بدلاً من اليأس أو البكاء.",
                options: [
                    { type: "angry", img: "q2-1.jpg", label: "تبكى وتستسلم للشعور بالإحباط", alt: "بسنت تبكي" },
                    { type: "angry", img: "q2-2.jpg", label: "تخرج من الفصل غاضبة", alt: "بسنت تخرج من الفصل" },
                    { type: "happy", img: "q2-3.jpg", label: "متحمسة و تسأل المعلمة لتوضيح الفكرة", alt: "بسنت متحمسة" }
                ]
            }
        ];

        function loadStage(stageIndex) {
            const stage = stagesData[stageIndex];
            stageStartTime = Date.now();
            if (!g1Stats[stageIndex]) g1Stats[stageIndex] = { title: stage.title, latency: null, wrong: 0 };
            document.getElementById('stageTitle').innerText = stage.title;
            document.getElementById('storyText').innerText = stage.story;
            document.getElementById('questionText').innerText = stage.question;
            document.getElementById('successMessage').innerText = stage.successText;
            
            if (stageIndex === stagesData.length - 1) {
                document.getElementById('nextBtnText').innerText = "انتقل للمرحلة التالية";
            } else {
                document.getElementById('nextBtnText').innerText = "انتقل للمرحلة التالية";
            }

            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';

            stage.options.forEach((opt) => {
                const choiceDiv = document.createElement('div');
                choiceDiv.className = "group cursor-pointer bg-white rounded-2xl p-4 border-4 " + 
                    (opt.type === 'happy' ? "border-green-200 hover:border-green-500" : "border-red-200 hover:border-red-500") + 
                    " shadow-md hover:shadow-xl transition-all transform hover:-translate-y-2 flex flex-col items-center";
                
                choiceDiv.onclick = () => handleChoice(opt.type);

                choiceDiv.innerHTML = `
                    <div class="overflow-hidden rounded-xl w-full h-48 bg-slate-100 flex items-center justify-center relative">
                        <img src="${opt.img}" alt="${opt.alt}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/400x300/dcfce7/16a34a?text=صورة+الاختيار'">
                    </div>
                    <p class="mt-4 font-bold ${opt.type === 'happy' ? 'text-green-600' : 'text-red-600'} text-sm md:text-base">${opt.label}</p>
                `;
                container.appendChild(choiceDiv);
            });

            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('quizSection').classList.remove('hidden');
        }

        function toggleNarration() {
            if (!('speechSynthesis' in window)) return;
            const btnText = document.getElementById('speakBtnText');
            const storyScript = stagesData[currentStage].story;

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                btnText.innerText = "استمع للقصة";
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(storyScript);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            utterance.onstart = () => { isSpeaking = true; btnText.innerText = "إيقاف الصوت"; };
            utterance.onend = utterance.onerror = () => { isSpeaking = false; btnText.innerText = "استمع للقصة"; };
            window.speechSynthesis.speak(utterance);
        }

        function handleChoice(choiceType) {
            const st = g1Stats[currentStage];
            if (st && st.latency === null) st.latency = ((Date.now() - stageStartTime) / 1000).toFixed(2);
            if (st && choiceType === 'angry') st.wrong++;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('speakBtnText').innerText = "استمع للقصة";
            }

            if (choiceType === 'angry') {
                // Open interactive story modal instead of video
                document.getElementById('videoModal').classList.remove('hidden');
                resetAndStartStory();
            } else if (choiceType === 'happy') {
                document.getElementById('quizSection').classList.add('hidden');
                document.getElementById('successSection').classList.remove('hidden');
            }
        }

        function closeVideoModal() {
            document.getElementById('videoModal').classList.add('hidden');
            stopStory();
        }

        function proceedToNextStage() {
            currentStage++;
            if (currentStage < stagesData.length) {
                loadStage(currentStage);
            } else {
                // نهاية اللعبة الأولى: إرسال بيانات التعلم والانتقال إلى اللعبة الثانية
                window.parent.postMessage({
                    type: "game1-complete",
                    data: { stages: g1Stats, seconds: (Date.now() - g1Start) / 1000 }
                }, "*");
            }
        }

        // --- كود تحكم قصة ليلى المدمجة ---
        const storyCaps = ["ليلى تحب العدّ بأصابعها، وهذه طريقتها المفضلة.", "البومة الحكيمة تقترح طريقة جديدة، وليلى تشعر بالضيق.", "ليلى تتعثّر في البداية، والبومة تطمئنها.", "نكوّن عشرة أولًا، ثم نضيف الباقي. هل رأيتم كم هي سريعة؟", "ليلى تفرح: صارت تملك طريقتين بدل طريقة واحدة!"];
        const storySay = ["ليلى تحب العدّ بأصابعها. ثمانية زائد خمسة، سأعدّ بأصابعي!", "البومة الحكيمة تقول: جرّبي طريقة جديدة، كوّني عشرة! فتقول ليلى: لا! طريقتي أسهل!", "لكن ليلى تتعثّر في البداية. فتقول البومة: لا بأس أن نتعثّر. الخطأ يعلّمنا!", "نكوّن عشرة أولًا. نأخذ اثنين من الخمسة، فيصير عندنا ثمانية زائد اثنين تساوي عشرة. ثم نضيف الثلاثة الباقية، فيكون الناتج ثلاثة عشر. ما أسرعها!", "ليلى فرحانة! الطريقة الجديدة لا تلغي القديمة، بل تضيف أداة جديدة إلى حقيبتها."];
        const storyD = [6500, 7000, 6000, 8500, 7000];
        const storyS = [...document.querySelectorAll(".story-sc")];
        let storyIndex = 0, storyPlaying = false, storyT0 = 0, storyFb;

        function speakStoryScene() {
            clearTimeout(storyFb);
            if (!('speechSynthesis' in window)) return;
            speechSynthesis.cancel();
            if (!storyPlaying) return;
            const u = new SpeechSynthesisUtterance(storySay[storyIndex]);
            u.lang = "ar-SA";
            u.rate = .85;
            u.pitch = 1.25;
            speechSynthesis.speak(u);
        }

        function showStoryScene(n) {
            storyIndex = (n + storyS.length) % storyS.length;
            storyS.forEach(s => s.classList.remove("on"));
            storyS[storyIndex].classList.add("on");
            document.getElementById("storyCap").textContent = storyCaps[storyIndex];
            storyT0 = performance.now();
            speakStoryScene();
        }

        function tickStory(now) {
            if (storyPlaying) {
                const p = (now - storyT0) / storyD[storyIndex];
                document.getElementById("storyBar").style.width = Math.min(p, 1) * 100 + "%";
                if (p >= 1) { showStoryScene(storyIndex + 1); }
            }
            if (!document.getElementById('videoModal').classList.contains('hidden')) {
                requestAnimationFrame(tickStory);
            }
        }

        function startInteractiveStory(e) {
            if (e) e.target.hidden = true;
            storyPlaying = true;
            document.getElementById("storyPlayBtn").textContent = "إيقاف مؤقت";
            showStoryScene(0);
            requestAnimationFrame(tickStory);
        }

        function resetAndStartStory() {
            document.getElementById("storyStartBtn").hidden = false;
            storyPlaying = false;
            storyIndex = 0;
            storyS.forEach(s => s.classList.remove("on"));
            storyS[0].classList.add("on");
            document.getElementById("storyCap").textContent = storyCaps[0];
            document.getElementById("storyBar").style.width = "0%";
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        function stopStory() {
            storyPlaying = false;
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        function toggleStoryPlay() {
            storyPlaying = !storyPlaying;
            document.getElementById("storyPlayBtn").textContent = storyPlaying ? "إيقاف مؤقت" : "تشغيل";
            storyT0 = performance.now() - parseFloat(document.getElementById("storyBar").style.width || 0) / 100 * storyD[storyIndex];
            if ('speechSynthesis' in window) {
                storyPlaying ? speechSynthesis.resume() : speechSynthesis.pause();
            }
            if (storyPlaying) requestAnimationFrame(tickStory);
        }

        function changeStoryScene(dir) {
            storyPlaying = true;
            document.getElementById("storyPlayBtn").textContent = "إيقاف مؤقت";
            document.getElementById("storyStartBtn").hidden = true;
            showStoryScene(storyIndex + dir);
        }

        window.onload = function() {
            loadStage(0);
        };
    <\/script>

</body>
</html>
</script>

</div>

<script>
    const questions = [
        {
            stageName: "السؤال الأول",
            title: "أي من الصور الآتية لا ترتبط بالفصل؟",
            topic: "العناصر المرتبطة بالفصل",
            difficulty: "سهل",
            hint: "ابحث عن الصورة الغريبة التي لا توجد داخل الفصل الدراسي.",
            options: [
                { text: "سبورة", img: "q1-o1 (1).jpg", correct: false },
                { text: "لوحات", img: "q1-o1 (3).jpg", correct: false },
                { text: "سيارة", img: "q1-o1 (2).jpg", correct: true }
            ]
        },
        {
            stageName: "السؤال الثاني",
            title: "أي من الصور الآتية لا ترتبط بالمدرسة؟",
            topic: "العناصر المرتبطة بالمدرسة",
            difficulty: "متوسط",
            hint: "فكر جيداً، ما هي الوسيلة التي لا تخص البيئة المدرسية؟",
            options: [
                { text: "العلم", img: "q2-o1(1).jpg", correct: false },
                { text: "طلاب", img: "q2-o1 (2).jpg", correct: false },
                { text: "طائرة", img: "q2-o1 (3).jpg", correct: true }
            ]
        },
        {
            stageName: "السؤال الثالث",
            title: "أي من الصور الآتية لا ترتبط بمادة الرياضيات؟",
            topic: "العناصر المرتبطة بمادة الرياضيات",
            difficulty: "متوسط",
            hint: "اختر العنصر الذي لا ينتمي لمجال الأرقام والحساب والرياضيات.",
            options: [
                { text: "الجمع والطرح", img: "q3-o1 (2).jpg", correct: false },
                { text: "الارقام", img: "q3-o1 (1).jpg", correct: false },
                { text: "الكرة الأرضية", img: "q3-o1 (3).jpg", correct: true }
            ]
        },
        {
            stageName: "السؤال الرابع",
            title: "أي من الصور الآتية لا ترتبط بمادة اللغة العربية؟",
            topic: "العناصر المرتبطة بمادة اللغة العربية",
            difficulty: "متقدم",
            hint: "دقق في الخيارات وحدد الصورة التي لا تخص لغتنا العربية.",
            options: [
                { text: "الحروف", img: "q4-o1 (3).jpg", correct: false },
                { text: "كلمات", img: "q4-o1 (2).jpg", correct: false },
                { text: "خريطة", img: "q4-o1 (1).jpg", correct: true }
            ]
        },
        {
            stageName: "السؤال الخامس",
            title: "أي من الصور الآتية لا تنتمي للأدوات المدرسية؟",
            topic: "الأدوات المدرسية",
            difficulty: "متقدم",
            hint: "استبعد الأداة التي نستخدمها في مكان آخر غير المدرسة أو الدراسة.",
            options: [
                { text: "قلم", img: "q5-o1 (3).jpg", correct: false },
                { text: "كراسة", img: "q5-o1 (1).jpg", correct: false },
                { text: "فرشاة أسنان", img: "q5-o1 (2).jpg", correct: true }
            ]
        }
    ];

    let currentStep = 0;
    let childName = "";
    let questionStartTime = 0;
    let gameStartTime = 0;
    let correctCount = 0;
    let errorCount = 0;
    let questionMetrics = {};
    let soundEnabled = true;

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('sound-toggle-btn');
        btn.innerText = soundEnabled ? "الصوت: مفعل" : "الصوت: مكتوم";
        if (!soundEnabled) window.speechSynthesis.cancel();
    }

    function speakText(text) {
        if (!soundEnabled) return;
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA';
        utterance.rate = 1.0;
        utterance.pitch = 1.1;

        const avatars = document.querySelectorAll('#mezo-avatar, #welcome-avatar');
        utterance.onstart = () => avatars.forEach(av => av.classList.add('speaking-glow'));
        utterance.onend = () => avatars.forEach(av => av.classList.remove('speaking-glow'));
        utterance.onerror = () => avatars.forEach(av => av.classList.remove('speaking-glow'));

        window.speechSynthesis.speak(utterance);
    }

    function repeatMezoSpeech() {
        const q = questions[currentStep];
        if (q) speakText(q.title);
    }

    function greetWelcome() {
        speakText("أهلاً بك في لعبة التعليم الذكي مع ميزو لاختبار وتنمية مهارات التركيز والتمييز!");
    }

    function openAiChatModal() { document.getElementById('ai-chat-modal').classList.remove('hidden'); }
    function closeAiChatModal() { document.getElementById('ai-chat-modal').classList.add('hidden'); }

    function startApp() {
        const input = document.getElementById('child-name');
        childName = input.value.trim();
        if (!childName) {
            alert("الرجاء كتابة اسم البطل أولاً!");
            return;
        }

        currentStep = 0;
        correctCount = 0;
        errorCount = 0;
        questionMetrics = {};
        gameStartTime = new Date();

        document.getElementById('welcome-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('player-display').innerText = `البطل: ${childName}`;

        loadQuestion();
    }

    function loadQuestion() {
        if (currentStep >= questions.length) {
            // نهاية اللعبة الثانية: الانتقال إلى اللعبة الثالثة ثم تظهر التحليلات في النهاية
            window.parent.postMessage({ type: "game2-complete" }, "*");
            return;
        }

        const q = questions[currentStep];
        questionStartTime = new Date();

        if (!questionMetrics[currentStep]) {
            questionMetrics[currentStep] = { 
                attempts: 0, 
                failedAttempts: 0, 
                title: q.title, 
                topic: q.topic,
                stageName: q.stageName,
                difficulty: q.difficulty,
                latency: 0,
                hintTriggered: false,
                failed: false 
            };
        }

        document.getElementById('question-counter').innerText = `السؤال ${currentStep + 1} من ${questions.length}`;
        document.getElementById('stage-badge').innerText = q.stageName;
        document.getElementById('question-title').innerText = q.title;
        document.getElementById('feedback-banner').innerText = "";
        document.getElementById('mezo-speech').innerText = q.title;

        renderOptions(q);
        speakText(q.title);
    }

    function renderOptions(q) {
        const optionsGrid = document.getElementById('options-grid');
        optionsGrid.innerHTML = "";

        q.options.forEach((opt, index) => {
            const card = document.createElement('div');
            card.className = `option-card-${index}`;
            card.style.cssText = "background: white; border: 2px solid #cbd5e1; border-radius: 16px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: space-between; box-shadow: 0 1px 2px rgba(0,0,0,0.05); min-height: 280px; transition: all 0.2s;";
            card.onmouseover = () => { card.style.borderColor = "#4f46e5"; card.style.transform = "translateY(-4px)"; };
            card.onmouseout = () => { card.style.borderColor = "#cbd5e1"; card.style.transform = "translateY(0)"; };
            card.onclick = () => handleAnswer(index);

            let contentHTML = "";
            if (opt.img) {
                contentHTML += `<div style="width: 100%; height: 170px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border-radius: 12px; overflow: hidden; padding: 4px; border: 1px solid #f1f5f9;">`;
                contentHTML += `<img src="${opt.img}" style="width: 100%; height: 100%; object-fit: contain; border-radius: 8px;" onerror="this.src='https://placehold.co/300x200/f1f5f9/4f46e5?text=صورة'">`;
                contentHTML += `</div>`;
            }
            contentHTML += `<span style="font-size: 0.95rem; font-weight: bold; color: #1e293b; text-align: center;">${opt.text}</span>`;
            card.innerHTML = contentHTML;
            optionsGrid.appendChild(card);
        });
    }

    function handleAnswer(selectedIndex) {
        const q = questions[currentStep];
        const now = new Date();
        const latencySec = ((now - questionStartTime) / 1000).toFixed(2);
        
        if (!questionMetrics[currentStep].latency || questionMetrics[currentStep].latency == 0) {
            questionMetrics[currentStep].latency = latencySec;
        }

        questionMetrics[currentStep].attempts++;

        const banner = document.getElementById('feedback-banner');
        const isCorrect = q.options[selectedIndex].correct;

        if (isCorrect) {
            correctCount++;
            banner.style.color = "#10b981";
            banner.innerText = `أبدعت يا ${childName}! إجابة صحيحة وممتازة جداً!`;
            document.getElementById('mezo-speech').innerText = banner.innerText;
            speakText(banner.innerText);
            
            setTimeout(() => {
                currentStep++;
                loadQuestion();
            }, 1200);
        } else {
            errorCount++;
            questionMetrics[currentStep].failed = true;
            questionMetrics[currentStep].failedAttempts++;
            
            if (questionMetrics[currentStep].failedAttempts >= 1) {
                questionMetrics[currentStep].hintTriggered = true;
                q.options.forEach((opt, idx) => {
                    if (opt.correct) {
                        const correctCard = document.querySelector(`.option-card-${idx}`);
                        if (correctCard) {
                            correctCard.classList.add('adaptive-hint-glow');
                        }
                    }
                });
            }

            banner.style.color = "#ef4444";
            banner.innerText = `محاولة للتفكير: ${q.hint || "ركز قليلاً يا بطل وجرب الإطار المضيء!"}`;
            document.getElementById('mezo-speech').innerText = banner.innerText;
            speakText(q.hint || "ركز قليلاً يا بطل وجرب الإطار المضيء!");
        }
    }

    function downloadReportAsImage() {
        const area = document.getElementById('printable-report-area');
        html2canvas(area, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `تقرير_لعبة_صعبة_لكن_مألوفة_${childName}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }

    function downloadReportAsExcel() {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "المهمة والسؤال,مستوى الصعوبة,زمن الاستجابة,عدد المحاولات (الأخطاء),حالة التشتت والتركيز,حالة التلميح الذكي\n";

        for (const m of getAllMetricRows()) {
            const latVal = parseFloat(m.latency || 4.0);
            let distractionStatus = "تركيز بصري ممتاز";
            if (m.failedAttempts > 1 || (!m.game1 && latVal > 7.0)) {
                distractionStatus = "تشتت ملحوظ (تردد عالٍ)";
            } else if (m.failedAttempts === 1 || (!m.game1 && latVal > 4.5)) {
                distractionStatus = "تشتت طفيف مؤقت";
            }
            const hintStatus = m.game4 ? (m.hintTriggered ? "تنبيه تصحيحي وإعادة المحاولة" : "استجابة تلقائية مباشرة") : m.game3 ? (m.hintTriggered ? "إعادة تشغيل القاعدة صوتيًا" : "استجابة تلقائية مباشرة") : m.game1 ? (m.hintTriggered ? "عرض قصة ليلى التفاعلية" : "استجابة تلقائية مباشرة") : m.hintTriggered ? "تفعيل الإطار المضيء التكيفي" : "إجابة تلقائية مباشرة";
            const row = [`"${m.stageName} - ${m.topic}"`, `"${m.difficulty}"`, `"${latVal} ثانية"`, `"${m.failedAttempts} محاولات خاطئة"`, `"${distractionStatus}"`, `"${hintStatus}"`];
            csvContent += row.join(",") + "\n";
        }

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `تقرير_لعبة_صعبة_لكن_مألوفة_${childName}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // ===== بيانات اللعبة الأولى (تصل من الصفحة الأم) لتدخل ضمن تحليلات التعلم =====
    function getGame1Summary() {
        const d = window.__game1Data;
        if (!d || !d.stages) return { available: false, correct: 0, errors: 0, stories: 0, seconds: 0 };
        const errors = d.stages.reduce((a, s) => a + (s ? s.wrong : 0), 0);
        return { available: true, correct: d.stages.length, errors: errors, stories: errors, seconds: d.seconds || 0 };
    }

    function getGame3Summary() {
        const d = window.__game3Data;
        if (!d || !d.wheel) return { available: false, correct: 0, errors: 0, seconds: 0 };
        const errors = d.wheel.reduce((a, s) => a + s.wrong, 0);
        return { available: true, correct: d.wheel.length + 3, errors: errors, seconds: (d.lettersSeconds || 0) };
    }

    function getGame4Summary() {
        const d = window.__game4Data;
        if (!d || !d.stages) return { available: false, correct: 0, errors: 0, seconds: 0 };
        const errors = d.stages.reduce((a, s) => a + (s ? s.wrong : 0), 0);
        return { available: true, correct: d.stages.length, errors: errors, seconds: d.seconds || 0 };
    }

    function getAllMetricRows() {
        const rows = [];
        const d = window.__game1Data;
        if (d && d.stages) {
            d.stages.forEach(s => {
                if (!s) return;
                const parts = (s.title || '').split(':');
                rows.push({
                    game1: true,
                    stageName: 'اللعبة الأولى - ' + (parts[0] || '').trim(),
                    topic: (parts[1] || '').trim(),
                    difficulty: 'صعبة لكن مألوفة',
                    latency: s.latency || 0,
                    failedAttempts: s.wrong,
                    hintTriggered: s.wrong > 0
                });
            });
        }
        const d3 = window.__game3Data;
        const extra = [];
        if (d3 && d3.wheel) {
            extra.push({
                game1: true, stageName: 'اللعبة الثالثة - المرحلة الأولى', topic: 'تنظيف الحروف بالرشاش',
                difficulty: 'مهارات الكتابة', latency: d3.lettersSeconds || 0, failedAttempts: 0, hintTriggered: false, game3: true
            });
            d3.wheel.forEach((w, i) => extra.push({
                game1: true, stageName: 'اللعبة الثالثة - المرحلة الثانية', topic: 'قاعدة ' + (i + 1) + ': ' + (d3.rules[i] || ''),
                difficulty: 'قواعد الصف', latency: w.latency || 0, failedAttempts: w.wrong, hintTriggered: w.wrong > 0, game3: true
            }));
        }
        const d4 = window.__game4Data;
        if (d4 && d4.stages) {
            d4.stages.forEach(s => {
                if (!s) return;
                extra.push({
                    game1: true, game4: true, stageName: 'اللعبة الرابعة - ' + (s.title || ''), topic: 'مغامرات بسنت',
                    difficulty: 'تقبّل الطرق الجديدة', latency: s.latency || 0, failedAttempts: s.wrong, hintTriggered: s.wrong > 0
                });
            });
        }
        return rows.concat(Object.values(questionMetrics), extra);
    }

    function showReport() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('report-screen').classList.add('active');

        document.getElementById('rep-main-title').innerText = `تقرير لعبة صعبة لكن مألوفة (${childName})`;
        
        const g1 = getGame1Summary();
        const g3 = getGame3Summary();
        const g4 = getGame4Summary();
        const totalErrors = errorCount + g1.errors + g3.errors + g4.errors;
        const successRateVal = Math.round(((correctCount + g1.correct + g3.correct + g4.correct) / (correctCount + g1.correct + g3.correct + g4.correct + totalErrors)) * 100) || 75;
        const errorRateVal = 100 - successRateVal;
        const totalScore = Math.max(50, 500 - (totalErrors * 10));
        
        const gameEndTime = new Date();
        const totalGameSeconds = (((gameEndTime - gameStartTime) / 1000) + g1.seconds + g4.seconds).toFixed(1);
        
        let totalLat = 0, countLat = 0;
        for (const mm of getAllMetricRows()) {
            if (mm.latency) {
                totalLat += parseFloat(mm.latency);
                countLat++;
            }
        }
        const avgLat = countLat > 0 ? (totalLat / countLat).toFixed(1) : "4.2";

        let flexibilityLabel = "ممتاز ومتطور";
        let flexibilityScoreColor = "#059669";
        if (totalErrors > 3) {
            flexibilityLabel = "تشتت عالي ويتطلب متابعة وتوجيه";
            flexibilityScoreColor = "#d97706";
        } else if (totalErrors > 1) {
            flexibilityLabel = "جيد مع تشتت بصري خفيف";
            flexibilityScoreColor = "#0284c7";
        }

        document.getElementById('rep-score').innerText = totalScore;
        document.getElementById('rep-success-rate').innerText = `صحيح: ${successRateVal}% | خطأ: ${errorRateVal}%`;
        document.getElementById('rep-avg-latency').innerText = `${totalGameSeconds} ثانية`;
        
        const flexEl = document.getElementById('rep-flexibility');
        flexEl.innerText = flexibilityLabel;
        flexEl.style.color = flexibilityScoreColor;

        document.getElementById('eval-part-1').innerText = `أظهر البطل ${childName} أداءً رائعاً في إتمام كافة أسئلة التحدي بمتوسط استجابة بلغ ${avgLat} ثانية للسؤال. نسبة الأسئلة الصحيحة ${successRateVal}%. الوقت الإجمالي المستغرق ${totalGameSeconds} ثانية.`
            + (g3.available ? ` وفي اللعبة الثالثة (الحروف وقواعد الصف) أتمّ البطل تنظيف الحروف وربط القواعد بصورها مع ${g3.errors} محاولات غير صحيحة.` : "")
            + (g1.available ? ` وفي اللعبة الأولى (تقبّل الطرق الجديدة) سجّل البطل ${g1.errors} اختيارات غير مناسبة وشاهد قصة ليلى ${g1.stories} مرات قبل أن يصل إلى الاختيار الصحيح في كل مرحلة.` : "")
            + (g4.available ? ` وفي اللعبة الرابعة (مغامرات بسنت) أجاب البطل عن ${g4.correct} أسئلة عن تقبّل الطرق الجديدة مع ${g4.errors} اختيارات غير صحيحة.` : "");

        const tableBody = document.getElementById('report-table-body');
        tableBody.innerHTML = "";

        for (const m of getAllMetricRows()) {
            const latVal = parseFloat(m.latency || 4.0);
            
            let distractionText = "تركيز بصري عالي";
            let statusStyle = "color: #059669; font-weight: bold;";
            
            if (m.failedAttempts > 1 || (!m.game1 && latVal > 7.0)) {
                distractionText = "تشتت ملحوظ وتردد عالي";
                statusStyle = "color: #dc2626; font-weight: 600;";
            } else if (m.failedAttempts === 1 || (!m.game1 && latVal > 4.5)) {
                distractionText = "تشتت بصري طفيف مؤقت";
                statusStyle = "color: #d97706; font-weight: 600;";
            }

            const hintStatus = m.game4 ? (m.hintTriggered ? "تنبيه تصحيحي وإعادة المحاولة" : "استجابة تلقائية مباشرة") : m.game3 ? (m.hintTriggered ? "إعادة تشغيل القاعدة صوتيًا" : "استجابة تلقائية مباشرة") : m.game1 ? (m.hintTriggered ? "عرض قصة ليلى التفاعلية" : "استجابة تلقائية مباشرة") : m.hintTriggered ? "تفعيل الإطار المضيء التكيفي" : "استجابة تلقائية مباشرة";

            const tr = document.createElement('tr');
            tr.style.borderBottom = "1px solid #f1f5f9";
            tr.innerHTML = `
                <td style="padding: 12px; font-weight: bold; color: #334155;">${m.stageName} - ${m.topic}</td>
                <td style="padding: 12px; color: #4f46e5; font-weight: 600;">${m.difficulty}</td>
                <td style="padding: 12px; color: #475569;">${latVal} ثانية</td>
                <td style="padding: 12px; font-weight: bold; color: #dc2626;">${m.failedAttempts} أخطاء</td>
                <td style="padding: 12px; ${statusStyle}">${distractionText}</td>
                <td style="padding: 12px; color: #4f46e5; font-weight: 500;">${hintStatus}</td>
            `;
            tableBody.appendChild(tr);
        }

        speakText(`تهانينا يا ${childName}! لقد أتممت جميع أسئلة التحدي بنجاح تام.`);
    }

    function sendChatMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        const chatMessages = document.getElementById('chat-messages');
        const userBubble = document.createElement('div');
        userBubble.style.cssText = "background: #4f46e5; color: white; padding: 12px; border-radius: 16px; border-top-right-radius: 0; max-width: 80%; margin-left: auto;";
        userBubble.innerText = text;
        chatMessages.appendChild(userBubble);
        input.value = "";
        chatMessages.scrollTop = chatMessages.scrollHeight;

        setTimeout(() => {
            const mezoBubble = document.createElement('div');
            mezoBubble.style.cssText = "background: #e0e7ff; color: #312e81; padding: 12px; border-radius: 16px; border-top-left-radius: 0; max-width: 80%; margin-right: auto;";
            mezoBubble.innerText = "أنا هنا دائماً لمساعدتك في قياس وتطوير مهارات التمييز والتركيز الذكي يا بطل!";
            chatMessages.appendChild(mezoBubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            speakText("أنا هنا دائما لمساعدتك يا بطل");
        }, 800);
    }
<\/script>

</body>
</html>
</script>

<!DOCTYPE html>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;text-align:center;user-select:none}
h1{font-size:1.6rem;margin:.6rem 0 .2rem}
p.t{margin:.2rem 1rem 1rem;font-size:1.1rem}
.stars{font-size:1.6rem;letter-spacing:.2rem}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:0 10px}
.lc{width:min(30%,260px);min-width:150px;background:var(--card);border:4px solid var(--line);border-radius:18px;padding:6px;position:relative}
.lc svg{width:100%;height:auto;touch-action:none;display:block;border-radius:12px}
.lc.done{border-color:var(--g)}
.lc .ok{position:absolute;top:6px;right:10px;font-size:2rem;display:none}
.lc.done .ok{display:block}
button{font-family:inherit;font-size:1.2rem;background:var(--o);color:#fff;border:0;border-radius:30px;padding:.5rem 1.4rem;margin:.8rem;cursor:pointer;font-weight:800}
button:focus-visible,.pic:focus-visible{outline:4px solid var(--b)}
#s2{display:none}
.wheel{width:min(92vw,360px);margin:0 auto;display:block}
.slice{transition:opacity .3s}
.pics{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 10px}
.pic{width:92px;height:92px;font-size:3rem;background:var(--card);border:4px solid var(--line);border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0;color:inherit}
.pic.right{border-color:var(--g);background:#e6f6e6}
.pic.wrong{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#bubble{display:inline-block;background:#fff;border:3px solid var(--b);border-radius:20px;padding:.3rem 1rem;margin:.2rem;min-height:2.2rem;font-size:1.2rem}
.drop{position:fixed;width:10px;height:10px;border-radius:50%;background:#58b8ff;pointer-events:none;animation:fl .5s forwards;z-index:9}
@keyframes fl{to{transform:translateY(24px) scale(.3);opacity:0}}
#spr{position:fixed;font-size:2.4rem;pointer-events:none;display:none;z-index:10;transform:translate(-50%,-90%)}
@media (prefers-reduced-motion:reduce){.drop,.pic.wrong{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs></svg>

<section id="s1">
<h1>المرحلة الأولى: نظّف الحرف بالرشاش 💦</h1>
<p class="t">ابدأ من النقطة الصفراء 🟡 وامسح الحرف باتجاه الأسهم</p>
<div class="stars" id="st1">☆☆☆</div>
<div class="row" id="letters"></div>
<button id="next" style="display:none">المرحلة الثانية ⮜</button>
</section>

<section id="s2">
<h1>المرحلة الثانية: عجلة قواعد الصف 🎡</h1>
<button id="ask">🎧 اسمع المساعد</button><br>
<div id="bubble">اضغط على الزر لتسمع القاعدة</div>
<div class="stars" id="st2">☆☆☆☆☆</div>
<svg class="wheel" id="wheel" viewBox="-110 -110 220 220"></svg>
<p class="t">اختر الصورة التي تناسب القاعدة</p>
<div class="pics" id="pics"></div>
<button id="again" style="display:none">العب مرة أخرى 🔄</button>
</section>
<div id="spr">🚿</div>

<script>
const $=s=>document.querySelector(s);
const G3={lettersStart:Date.now(),lettersSeconds:0,wheel:[],askT:0};
for(let i=0;i<5;i++)G3.wheel.push({wrong:0,latency:0});
const NS="http://www.w3.org/2000/svg";
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}

/* ---------- المرحلة الأولى ---------- */
const letters=[
 {n:"أ",d:"M100 52 L100 178",dots:[[100,22,9]]},
 {n:"ب",d:"M165 65 L165 100 C165 125 152 130 130 130 L70 130 C48 130 35 122 35 100 L35 70",dots:[[100,170,9]]},
 {n:"د",d:"M55 60 L105 60 C140 62 148 90 140 118 C134 140 112 150 88 150 L45 150"}
];
let doneCount=0;
const spr=$("#spr");
function drops(x,y){const d=document.createElement("div");d.className="drop";d.style.left=x+(Math.random()*20-10)+"px";d.style.top=y+(Math.random()*10)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),500)}
letters.forEach(L=>{
 const card=document.createElement("div");card.className="lc";
 const s=el("svg",{viewBox:"0 0 200 200","aria-label":"حرف "+L.n},card);
 el("rect",{width:200,height:200,fill:"#6cc35b"},s);
 el("rect",{y:150,width:200,height:50,fill:"#5ab04a"},s);
 const stain=el("path",{d:L.d,fill:"none",stroke:"#2f4a2a","stroke-width":28,"stroke-linecap":"round","stroke-linejoin":"round"},s);
 const ds=(L.dots||[]).map(q=>el("circle",{cx:q[0],cy:q[1],r:q[2],fill:"#2f4a2a"},s));
 const guide=el("path",{d:L.d,fill:"none",stroke:"#fff","stroke-width":3,"stroke-dasharray":"7 6","marker-end":"url(#ar)","pointer-events":"none"},s);
 const len=stain.getTotalLength(),p0=stain.getPointAtLength(0);
 const start=el("circle",{cx:p0.x,cy:p0.y,r:8,fill:"#ffd23f",stroke:"#fff","stroke-width":2,"pointer-events":"none"},s);
 const ok=document.createElement("span");ok.className="ok";ok.textContent="⭐";card.appendChild(ok);
 let p=0,fin=false;
 stain.setAttribute("stroke-dasharray",len+" "+len);stain.setAttribute("stroke-dashoffset",0);
 function pt(e){const q=s.createSVGPoint();q.x=e.clientX;q.y=e.clientY;return q.matrixTransform(s.getScreenCTM().inverse())}
 function move(e){
  spr.style.display="block";spr.style.left=e.clientX+"px";spr.style.top=e.clientY+"px";
  if(e.buttons===0&&e.pointerType==="mouse")return;
  drops(e.clientX,e.clientY);
  if(fin)return;
  const c=pt(e);let moved=false;
  while(p<len){const q=stain.getPointAtLength(Math.min(p+8,len));if(Math.hypot(q.x-c.x,q.y-c.y)<26){p=Math.min(p+8,len);moved=true}else break}
  if(moved){stain.setAttribute("stroke-dashoffset",-p);if(p>0)start.style.display="none"}
  if(p>=len-1){fin=true;stain.style.display="none";guide.style.display="none";
   ds.forEach(c=>c.style.display="none");
   card.classList.add("done");doneCount++;
   $("#st1").textContent="⭐".repeat(doneCount)+"☆".repeat(3-doneCount);say("أحسنت");
   if(doneCount===3)$("#next").style.display="inline-block"}
 }
 s.addEventListener("pointerdown",e=>{s.setPointerCapture(e.pointerId);move(e)});
 s.addEventListener("pointermove",move);
 s.addEventListener("pointerleave",()=>spr.style.display="none");
 s.addEventListener("pointerup",()=>{if(!fin)spr.style.display="none"});
 $("#letters").appendChild(card);
});
$("#next").onclick=()=>{G3.lettersSeconds=(Date.now()-G3.lettersStart)/1000;$("#s1").style.display="none";spr.style.display="none";$("#s2").style.display="block";startWheel()};

/* ---------- المرحلة الثانية ---------- */
const rules=[
 {t:"استمع وانظر إلى المعلم",i:"👀",c:"#ee8134"},
 {t:"ارفع إصبعك قبل أن تتحدث",i:"🙋",c:"#d9805f"},
 {t:"اخفض صوتك عندما تتحدث",i:"🤫",c:"#c9776a"},
 {t:"حافظ على نظافة الصف",i:"🧹",c:"#a98a87"},
 {t:"حافظ على يديك وقدميك وأشياءك بعيدًا عن الآخرين",i:"🙅",c:"#9a9a9a"}
];
let todo,cur,solved;
function wheel(){
 const w=$("#wheel");w.innerHTML="";
 rules.forEach((r,k)=>{
  const a0=(k*72-90)*Math.PI/180,a1=((k+1)*72-90)*Math.PI/180,R=100;
  const g=el("g",{class:"slice",id:"sl"+k,opacity:.55},w);
  el("path",{d:`M0 0L${R*Math.cos(a0)} ${R*Math.sin(a0)}A${R} ${R} 0 0 1 ${R*Math.cos(a1)} ${R*Math.sin(a1)}Z`,fill:r.c,stroke:"#fff","stroke-width":2},g);
  const m=(a0+a1)/2,tx=el("text",{x:58*Math.cos(m),y:58*Math.sin(m),"text-anchor":"middle","font-size":11,fill:"#fff","font-weight":800,"font-family":"inherit"},g);
  tx.textContent=String(k+1);
 });
}
function startWheel(){
 solved=0;todo=[0,1,2,3,4].sort(()=>Math.random()-.5);cur=null;
 $("#st2").textContent="☆☆☆☆☆";$("#again").style.display="none";$("#ask").style.display="inline-block";
 $("#bubble").textContent="اضغط على الزر لتسمع القاعدة";wheel();
 const P=$("#pics");P.innerHTML="";
 [0,1,2,3,4].sort(()=>Math.random()-.5).forEach(k=>{
  const b=document.createElement("button");b.className="pic";b.textContent=rules[k].i;b.setAttribute("aria-label","صورة "+(k+1));
  b.onclick=()=>pick(k,b);P.appendChild(b)});
}
function ask(){
 if(!todo.length)return;cur=todo[0];
 const t=rules[cur].t;$("#bubble").textContent="🎧 "+t;say(t);G3.askT=Date.now();
 document.querySelectorAll(".slice").forEach(s=>s.style.filter="");
}
$("#ask").onclick=ask;
function pick(k,b){
 if(cur===null){ask();return}
 if(k===cur){
  G3.wheel[k].latency=(Date.now()-G3.askT)/1000;
  b.classList.add("right");b.disabled=true;
  $("#sl"+k).setAttribute("opacity",1);solved++;todo.shift();cur=null;
  const tx=document.querySelector("#sl"+k+" text");tx.textContent=rules[k].i;tx.setAttribute("font-size",20);
  $("#st2").textContent="⭐".repeat(solved)+"☆".repeat(5-solved);say("أحسنت");
  if(solved===5){$("#bubble").textContent="🎉 رائع! أكملت كل القواعد";$("#again").textContent="اللعبة التالية ◀";$("#again").style.display="inline-block";$("#ask").style.display="none"}
  else{$("#bubble").textContent="صحيح! اضغط لتسمع القاعدة التالية"}
 }else{
  G3.wheel[cur].wrong++;
  b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");
  $("#bubble").textContent="حاول مرة أخرى 🎧 "+rules[cur].t;say(rules[cur].t);
 }
}
$("#again").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}
 window.parent.postMessage({type:"game3-complete",data:{lettersSeconds:G3.lettersSeconds,wheel:G3.wheel,rules:rules.map(r=>r.t)}},"*")};
<\/script>
</body>
</html>

        <\!-- Quiz / Choices Section -->

    </div>

    <script>
        let currentStage = 0;
        let isSpeaking = false;
        const g4Stats = [];
        const g4Start = Date.now();
        let g4StageStart = Date.now();

        const stagesData = [
            {
                title: "السؤال الأول",
                story: "قررت بسنت طلب المساعدة من المعلمة لتعلم الطريقة الجديدة فقد تكون أكثر سهولة من الطريقة التي اعتاد عليها.",
                question: "1- بم ستشعر بعد تعلم قصة بسنت عندما تضطر لتعلم طرائق جديدة غير مألوفة؟",
                successMessage: "رائع جداً! تتعلم من قصة بسنت الحماس وتقبل الطرق الجديدة بكل سرور.",
                options: [
                    { type: "wrong", img: "q1-p1.jpg", label: "حزينة", alt: "حزينة" },
                    { type: "correct", img: "q1-p2.jpg", label: "تشعر بالحماس", alt: "تشعر بالحماس" },
                    { type: "wrong", img: "q1-p3.jpg", label: "غاضبة", alt: "غاضبة" }
                ]
            },
            {
                title: "السؤال الثاني",
                story: "عندما تطلب إليك المعلمة أداء الأنشطة بطرائق جديدة ومبتكرة.",

            {

                ]
            },
            {
                title: "السؤال الرابع",

                ]
            }
        ];

        function loadStage(stageIndex) {
            const stage = stagesData[stageIndex];
            g4StageStart = Date.now();
            if (!g4Stats[stageIndex]) g4Stats[stageIndex] = { title: stage.title, wrong: 0, latency: 0 };
            document.getElementById('stageTitle').innerText = stage.title;
            document.getElementById('storyText').innerText = stage.story;
            document.getElementById('questionText').innerText = stage.question;
            document.getElementById('successMessage').innerText = stage.successMessage;
            
            if (stageIndex === stagesData.length - 1) {
                document.getElementById('nextBtnText').innerText = "إنهاء اللعبة بنجاح";
            } else {
                document.getElementById('nextBtnText').innerText = "السؤال التالي";
            }

            const container = document.getElementById('choicesContainer');
            container.innerHTML = '';

            stage.options.forEach((opt) => {
                const choiceDiv = document.createElement('div');
                choiceDiv.className = "group cursor-pointer bg-white rounded-2xl p-4 border-4 " + 
                    (opt.type === 'correct' ? "border-green-200 hover:border-green-500" : "border-red-200 hover:border-red-500") + 
                    " shadow-md hover:shadow-xl transition-all transform hover:-translate-y-2 flex flex-col items-center";
                
                choiceDiv.onclick = () => handleChoice(opt.type);

                choiceDiv.innerHTML = `
                    <div class="overflow-hidden rounded-xl w-full h-48 bg-slate-100 flex items-center justify-center relative">
                        <img src="${opt.img}" alt="${opt.alt}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/400x300/dcfce7/16a34a?text=صورة+الاختيار'">
                    </div>
                    <p class="mt-4 font-bold ${opt.type === 'correct' ? 'text-green-600' : 'text-red-600'} text-sm md:text-base">${opt.label}</p>
                `;
                container.appendChild(choiceDiv);
            });

            document.getElementById('successSection').classList.add('hidden');
            document.getElementById('quizSection').classList.remove('hidden');
            document.getElementById('quizSection').style.display = 'block';
        }

        function toggleNarration() {
            if (!('speechSynthesis' in window)) {
                alert("عذراً، متصفحك لا يدعم خاصية الصوت.");
                return;
            }

            const btnText = document.getElementById('speakBtnText');
            const storyScript = stagesData[currentStage].story;

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                btnText.innerText = "استمع للقصة";
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(storyScript);
            utterance.lang = 'ar-SA';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;

            utterance.onstart = () => { isSpeaking = true; btnText.innerText = "إيقاف الصوت"; };
            utterance.onend = () => { isSpeaking = false; btnText.innerText = "استمع للقصة"; };
            utterance.onerror = () => { isSpeaking = false; btnText.innerText = "استمع للقصة"; };

            window.speechSynthesis.speak(utterance);
        }

        function handleChoice(choiceType) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                document.getElementById('speakBtnText').innerText = "استمع للقصة";
            }

            if (choiceType === 'wrong') {
                g4Stats[currentStage].wrong++;
                document.getElementById('videoModal').classList.remove('hidden');
            } else if (choiceType === 'correct') {
                g4Stats[currentStage].latency = (Date.now() - g4StageStart) / 1000;
                document.getElementById('quizSection').classList.add('hidden');
                document.getElementById('successSection').classList.remove('hidden');
            }
        }

        function closeVideoModal() {
            document.getElementById('videoModal').classList.add('hidden');
        }

        function proceedToNextStage() {
            currentStage++;
            if (currentStage < stagesData.length) {
                loadStage(currentStage);
            } else {
                // نهاية اللعبة الرابعة: إرسال البيانات والانتقال إلى تحليلات التعلم
                window.parent.postMessage({
                    type: "game4-complete",
                    data: { stages: g4Stats, seconds: (Date.now() - g4Start) / 1000 }
                }, "*");
            }
        }

        window.onload = function() {
            loadStage(0);
        };
    <\/script>

</body>
</html>
</script>

<script>
  (function () {
    function readSource(id) {
      var raw = document.getElementById(id).textContent;
      return raw.replace(/<\\\/script/g, '<' + '/script').replace(/<\\!--/g, '<' + '!--').trim();
    }

    var frame1 = document.getElementById('frame-game1');
    var frame2 = document.getElementById('frame-game2');
    var frame3 = document.getElementById('frame-game3');
    var frame4 = document.getElementById('frame-game4');
    var game3Data = null;

    // تبدأ اللعبة الأولى
    frame1.srcdoc = readSource('src-game1');

    window.addEventListener('message', function (e) {
      if (!e.data || !e.data.type) return;

      // نهاية الأولى -> بداية الثانية (ومعها بيانات الأولى)
      if (e.data.type === 'game1-complete') {
        if (!frame2.hidden) return;
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        var json = JSON.stringify(e.data.data || null).replace(/</g, '\\u003c');
        var inject = '<' + 'script>window.__game1Data = ' + json + ';<' + '/script>';
        frame2.srcdoc = readSource('src-game2').replace('<head>', '<head>' + inject);
        frame2.hidden = false;
        frame1.hidden = true;
        frame1.removeAttribute('srcdoc');
        frame1.src = 'about:blank';
      }

      // نهاية الثانية -> بداية الثالثة (الثانية تبقى محفوظة لعرض التحليلات لاحقًا)
      if (e.data.type === 'game2-complete') {
        if (!frame3.hidden || frame3.srcdoc) return;
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        frame3.srcdoc = readSource('src-game3');
        frame3.hidden = false;
        frame2.hidden = true;
      }

      // نهاية الثالثة -> بداية الرابعة
      if (e.data.type === 'game3-complete') {
        if (!frame2.hidden) return;
        if (frame4.srcdoc) return;
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        game3Data = e.data.data || null;
        frame4.srcdoc = readSource('src-game4');
        frame4.hidden = false;
        frame3.hidden = true;
        frame3.removeAttribute('srcdoc');
        frame3.src = 'about:blank';
      }

      // نهاية الرابعة -> تحليلات التعلم في نهاية اللعبة
      if (e.data.type === 'game4-complete') {
        if (!frame2.hidden) return;
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        try {
          frame2.contentWindow.__game3Data = game3Data;
          frame2.contentWindow.__game4Data = e.data.data || null;
          frame2.contentWindow.showReport();
        } catch (err) { console.error(err); }
        frame2.hidden = false;
        frame4.hidden = true;
        frame4.removeAttribute('srcdoc');
        frame4.src = 'about:blank';
      }
    });
  })();
</script>

</body>
</html>
